<p><a href="/works/work-192/">Continue to work 192</a></p>
<script id="bycraft-similar-title">
(function () {
  var _open = window.openBycraftModal;
  if (typeof _open !== "function") return;
  window.openBycraftModal = function (e) {
    try {
      var t = e && e.currentTarget;
      var label = t && (t.textContent || "").trim();
      var r = _open.apply(this, arguments);
      if (label && /Заказать похожий|Order similar|similar/i.test(label)) {
        var title = document.querySelector("#bycraft-modal .bc-modal__title");
        if (title) {
          title.textContent = location.pathname.indexOf("/en/") === -1
            ? "Заказать похожий арт-объект"
            : "Order a similar art object";
        }
      }
      return r;
    } catch (err) {
      return _open.apply(this, arguments);
    }
  };
})();
</script>


<script id="bycraft-form-title-data">
(function(){
  var _o = window.openBycraftModal;
  if (typeof _o !== "function") return;
  window.openBycraftModal = function(e){
    var btn = e && (e.currentTarget || e.target);
    var r = _o.apply(this, arguments);
    try {
      if (btn && btn.getAttribute) {
        var t = btn.getAttribute("data-form-title");
        var s = btn.getAttribute("data-form-sub");
        var title = document.querySelector("#bycraft-modal .bc-modal__title");
        var sub = document.querySelector("#bycraft-modal .bc-modal__subtitle");
        if (t && title) title.textContent = t;
        if (s !== null && sub) { if (s === "") sub.style.display = "none"; else sub.textContent = s; }
        if (s === "" && !sub && title) {
          /* subtitle may be in next sibling */
        }
      }
    } catch(err) {}
    return r;
  };
})();
</script>

</body>
</html>
