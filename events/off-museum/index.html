  <link rel="stylesheet" href="/css/style.css?v=1060">

<style id="bycraft-mobile-nav-v4">
/* Мобильное меню v4: закрыто по умолчанию, открывается только по кнопке */
@media screen and (max-width: 900px) {
  .site-header {
    position: sticky !important;
    top: 0 !important;
    z-index: 100000 !important;
    background: #fff !important;
  }
  .site-header .header-inner,
  .site-header .container {
    position: relative !important;
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: nowrap !important;
    align-items: center !important;
    justify-content: space-between !important;
    width: 100% !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
  }
  .brand-logo {
    flex-shrink: 0 !important;
  }
  .mobile-toggle {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    margin-left: auto !important;
    z-index: 100003 !important;
    cursor: pointer !important;
    pointer-events: auto !important;
    padding: 8px 14px !important;
    border: 1px solid #1A1A1A !important;
    background: #fff !important;
    color: #1A1A1A !important;
    font-size: 13px !important;
    text-transform: uppercase !important;
    font-family: inherit !important;
  }
  /* ЗАКРЫТО: полностью скрыто */
  nav.main-nav,
  .main-nav {
    display: none !important;
    visibility: hidden !important;
    height: 0 !important;
    max-height: 0 !important;
    overflow: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
    position: absolute !important;
    top: 100% !important;
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  /* ОТКРЫТО: только с классом open */
  nav.main-nav.open,
  .main-nav.open {
    display: flex !important;
    visibility: visible !important;
    height: auto !important;
    max-height: 80vh !important;
    overflow-y: auto !important;
    opacity: 1 !important;
    pointer-events: auto !important;
    flex-direction: column !important;
    align-items: stretch !important;
    gap: 0 !important;
    background: #ffffff !important;
    padding: 8px 16px 20px !important;
    box-shadow: 0 12px 28px rgba(0,0,0,0.12) !important;
    z-index: 100002 !important;
    border-bottom: 1px solid #eee !important;
  }
  .main-nav.open > a,
  .main-nav.open .nav-link,
  .main-nav.open .nav-link-btn,
  .main-nav.open .nav-item-dropdown,
  .main-nav.open .nav-item-dropdown > .nav-link {
    display: block !important;
    width: 100% !important;
    padding: 14px 0 !important;
    border-bottom: 1px solid #f0f0f0 !important;
    font-size: 16px !important;
  }
  .main-nav.open .nav-dropdown {
    display: block !important;
    position: static !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 0 0 12px !important;
  }
  .main-nav.open .lang-switch {
    display: flex !important;
    gap: 12px !important;
    padding: 14px 0 !important;
  }
}
@media screen and (min-width: 901px) {
  .mobile-toggle {
    display: none !important;
  }
  nav.main-nav,
  .main-nav {
    display: flex !important;
    visibility: visible !important;
    height: auto !important;
    max-height: none !important;
    overflow: visible !important;
    opacity: 1 !important;
    pointer-events: auto !important;
    position: static !important;
    flex-direction: row !important;
    width: auto !important;
    box-shadow: none !important;
    padding: 0 !important;
  }
}
</style>

</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand-logo">BYCRAFT</a>
      <nav class="main-nav">
        <a href="/works/" class="nav-link">Работы</a>
        <a href="/workshop/" class="nav-link">Мастерская</a>
        <a href="/events/" class="nav-link active">События</a>
        <a href="/curators/" class="nav-link">Для кураторов</a>
        <a href="/contacts/" class="nav-link-btn">Контакты</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="container" style="margin-top:40px; margin-bottom:80px; max-width:900px;">
      <a href="/events/" class="btn-arrow" style="font-size:14px; border:none; padding:0;">← Все события</a>
      <h1 class="section-title page-title-14-bold" style="margin-top:16px; margin-bottom:16px;">OFF MUSEUM</h1>
      <p class="event-detail-meta"><strong>Даты:</strong> Май 2026</p>
      <p class="event-detail-meta"><strong>Место:</strong> Минск, Арт Фабрика</p>
      <p class="event-detail-meta"><strong>Организатор:</strong> OFF MUSEUM / Арт Фабрика</p>
      <p class="event-detail-meta"><strong>Работы:</strong> Работы BYCRAFT</p>
      <p class="event-detail-meta"><strong>Результат:</strong> Участие в экспозиции</p>
      <div class="event-detail-grid">
        <img src="/images/events/sig-event-03.jpg" alt="OFF MUSEUM" loading="lazy">
        
      </div>
      <p><a href="https://bycraft.by/events/" target="_blank" rel="noopener noreferrer">Источник →</a></p>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p style="color:#fff;">© 2026 BYCRAFT</p>
    </div>
  </footer>

<script id="bycraft-mobile-nav-v4">
(function () {
  function ready(fn) {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fn);
    else fn();
  }
  ready(function () {
    var btn = document.querySelector(".mobile-toggle");
    var nav = document.querySelector(".main-nav");
    if (!btn || !nav) return;

    // Стартовое состояние: закрыто
    nav.classList.remove("open");
    var isEn = location.pathname.indexOf("/en/") !== -1;
    btn.textContent = isEn ? "Menu" : "Меню";
    btn.setAttribute("aria-expanded", "false");

    // Один обработчик (clone снимает старые)
    var fresh = btn.cloneNode(true);
    btn.parentNode.replaceChild(fresh, btn);
    btn = fresh;

    function closeMenu() {
      nav.classList.remove("open");
      btn.textContent = isEn ? "Menu" : "Меню";
      btn.setAttribute("aria-expanded", "false");
    }
    function openMenu() {
      nav.classList.add("open");
      btn.textContent = "✕";
      btn.setAttribute("aria-expanded", "true");
    }

    btn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (nav.classList.contains("open")) closeMenu();
      else openMenu();
    });

    nav.querySelectorAll("a").forEach(function (a) {
      a.addEventListener("click", function () { closeMenu(); });
    });

    document.addEventListener("click", function (e) {
      if (!nav.classList.contains("open")) return;
      if (nav.contains(e.target) || btn.contains(e.target)) return;
      closeMenu();
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeMenu();
    });
  });
})();
</script>

</body>
</html>
