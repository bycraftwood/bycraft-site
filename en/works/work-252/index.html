<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <meta http-equiv="refresh" content="0;url=/en/works/work-192/">
  <link rel="canonical" href="https://bycraft.by/en/works/work-192/">
  <script>location.replace("/en/works/work-192/");</script>
</head>
<body><p><a href="/en/works/work-192/">Continue</a></p>
<script id="cookie-en-patch">
(function () {
  if (location.pathname.indexOf("/en/") === -1) return;
  function tr() {
    var b = document.getElementById("cookieBanner") || document.querySelector(".cookie-banner, .cookie-banner--v2");
    if (!b) return;
    var t = b.querySelector("strong, h3, .cookie-banner__title");
    if (t) t.textContent = "We use cookies";
    var p = b.querySelector("p");
    if (p) p.textContent = "They help improve the experience. By continuing, you agree to their use.";
    var a = document.getElementById("cookieAcceptAll") || b.querySelector(".cookie-btn--primary");
    if (a) a.textContent = "Accept all";
    var s = document.getElementById("cookieConfigure") || b.querySelector(".cookie-btn--ghost");
    if (s) s.textContent = "Settings";
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { setTimeout(tr, 50); setTimeout(tr, 400); });
  else { setTimeout(tr, 50); setTimeout(tr, 400); }
  var obs = new MutationObserver(tr);
  obs.observe(document.documentElement, { childList: true, subtree: true });
})();
</script>

</body>
</html>
